<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Auto-Retter</title>
  <!-- Als App auf dem Startbildschirm: Vollbild und immer quer -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#14161c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #14161c;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    /* Grösse, Lage und Drehung setzt game.js (resize) */
    canvas { position: absolute; display: block; transform-origin: center center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <!-- three.js für die 3D-Rennstrecke (race.js wird erst beim ersten Rennen geladen) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="version.js"></script>
  <script src="game.js"></script>
</body>
</html>
